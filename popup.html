<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<header id="header">
  <img src="icons/icon32.png" alt="" width="26" height="26" class="logo">
  <h1 id="headerTitle">C.V.</h1>
  <div class="header-actions">
    <button id="settingsBtn" class="icon-btn ghost" type="button" data-i18n-title="settingsTitle" aria-label="Settings" title="Impostazioni">
      <!-- gear icon -->
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button id="homeBtn" class="icon-btn ghost" type="button" data-i18n-title="homeTitle" aria-label="Home" title="Home" style="display: none;">
      <!-- home icon -->
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </button>
    <button id="coffeeBtn" class="icon-btn coffee-btn ghost" type="button" title="Support on Ko-fi" aria-label="Support on Ko-fi">
      <!-- coffee cup icon -->
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
        <line x1="6" y1="1" x2="6" y2="4"/>
        <line x1="10" y1="1" x2="10" y2="4"/>
        <line x1="14" y1="1" x2="14" y2="4"/>
      </svg>
    </button>
  </div>
</header>

<!-- Settings panel (full-view when active) -->
<div id="settingsPanel" class="settings-view" style="display: none;" hidden>
  <div class="settings-card">
    <div class="setting-row" id="langRow">
      <div class="setting-text">
        <span class="setting-title" data-i18n="settingLanguage">Lingua</span>
        <span class="setting-desc" data-i18n="settingLanguageDesc">Scegli la lingua dell'interfaccia</span>
      </div>
      <div class="setting-select-wrap">
        <select id="langSelect" class="setting-select" aria-label="Lingua">
          <option value="auto">Auto</option>
          <option value="it">Italiano</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="ru">Русский</option>
          <option value="zh_CN">中文</option>
          <option value="ja">日本語</option>
          <option value="ar">العربية</option>
        </select>
      </div>
    </div>

    <div class="setting-divider"></div>

    <div class="setting-row clickable" id="shortcutsBtn" role="button" tabindex="0">
      <div class="setting-text">
        <span class="setting-title" data-i18n="shortcutsTitle">Scorciatoie da tastiera</span>
        <span class="setting-desc" data-i18n="shortcutsDesc">Abilita tasti rapidi</span>
      </div>
      <div class="setting-action-icons">
        <svg class="shortcut-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <line x1="6" y1="8" x2="6.01" y2="8"/>
          <line x1="10" y1="8" x2="10.01" y2="8"/>
          <line x1="14" y1="8" x2="14.01" y2="8"/>
          <line x1="18" y1="8" x2="18.01" y2="8"/>
          <line x1="6" y1="12" x2="6.01" y2="12"/>
          <line x1="10" y1="12" x2="10.01" y2="12"/>
          <line x1="14" y1="12" x2="14.01" y2="12"/>
          <line x1="18" y1="12" x2="18.01" y2="12"/>
          <line x1="7" y1="16" x2="17" y2="16"/>
        </svg>
        <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>
    </div>

    <div class="setting-divider"></div>

    <!-- Ricorda volume per scheda posizionato sotto Scorciatoie da tastiera -->
    <label class="setting-row">
      <div class="setting-text">
        <span class="setting-title" data-i18n="settingRemember">Ricorda volume per scheda</span>
        <span class="setting-desc" data-i18n="settingRememberDesc">Mantiene il livello per ogni scheda durante la navigazione</span>
      </div>
      <input type="checkbox" id="rememberVol" checked>
    </label>

    <div class="setting-divider"></div>

    <!-- Picture-in-Picture automatico -->
    <label class="setting-row">
      <div class="setting-text">
        <span class="setting-title" data-i18n="settingPip">Picture-in-Picture automatico</span>
        <span class="setting-desc" data-i18n="settingPipDesc">Attiva automaticamente il video in PiP quando cambi scheda o riduci a icona</span>
      </div>
      <input type="checkbox" id="autoPip" checked>
    </label>
  </div>

  <!-- Settings footer -->
  <div class="settings-footer">
    <div class="author-row">
      <span>Created by </span><a href="https://github.com/d4ruerk1" target="_blank" rel="noopener noreferrer" class="link author-link">d4ruerk1</a>
    </div>
    <div class="version-group">
      <button id="updateDownloadBtn" class="update-dl-btn" type="button" aria-label="Aggiornamento disponibile" title="Aggiornamento disponibile" style="display: none;" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
      <span class="ver-pill">v1.3.0</span>
    </div>
  </div>
</div>

<p id="restricted" class="note restricted-note" role="status" hidden data-i18n="restricted"></p>

<main id="main">
  <!-- Card 1: VOLUME -->
  <section class="card" aria-labelledby="volT">
    <div class="row">
      <h2 id="volT" data-i18n="volume">VOLUME</h2>
      <div class="vol-out-wrap">
        <output id="volOut" for="vol" title="Clicca per modificare con la tastiera">100%</output>
        <input type="number" id="volInput" min="0" max="500" step="1" value="100" class="vol-edit-input" style="display: none;" aria-label="Modifica percentuale volume">
      </div>
    </div>
    <div class="slider-row">
      <button id="muteBtn" class="mute-btn ghost" type="button" aria-label="Mute" data-i18n-title="mute" title="Muto">
        <!-- Dynamic waves icon will be injected by JS -->
        <svg class="mute-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="9 5 5 9 2 9 2 15 5 15 9 19 9 5"></polygon>
          <path d="M13 9a4 4 0 0 1 0 6"></path>
          <path d="M16 6.5a8 8 0 0 1 0 11"></path>
        </svg>
      </button>
      <div class="slider-wrapper">
        <input type="range" id="vol" min="0" max="500" step="1" value="100" aria-labelledby="volT">
      </div>
    </div>
    <div class="ticks vol-ticks" aria-hidden="true">
      <span style="--f:0">0</span>
      <span style="--f:.2">100%</span>
      <span style="--f:.4">200%</span>
      <span style="--f:.6">300%</span>
      <span style="--f:.8">400%</span>
      <span style="--f:1">500%</span>
    </div>
    <!-- Volume chips: 50%, 100%, 150%, 300%, 500% -->
    <div class="chips vol-grid" id="volChips">
      <button type="button" data-v="50">50%</button>
      <button type="button" data-v="100">100%</button>
      <button type="button" data-v="150">150%</button>
      <button type="button" data-v="300">300%</button>
      <button type="button" data-v="500">500%</button>
    </div>

    <!-- Dismissable alert: strictly hidden unless vol > 100% and not permanently dismissed -->
    <div id="volNoteBox" class="note-box warn" role="status" style="display: none;" hidden>
      <div class="note-box-left">
        <svg class="warn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span id="volNoteText" class="note-box-text" data-i18n="boostWarning">Volume > 100%: possibile distorsione audio.</span>
      </div>
      <button id="dismissVolNote" class="note-close-btn" type="button" aria-label="Dismiss warning" title="Chiudi avviso">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <p id="volErrorNote" class="note warn" role="status" hidden></p>
  </section>

  <!-- Card 2: VELOCITÀ -->
  <section class="card" aria-labelledby="spdT">
    <div class="row">
      <div class="section-title-wrap">
        <svg class="section-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 14 4-4"/>
          <path d="M3.34 19a10 10 0 1 1 17.32 0"/>
        </svg>
        <h2 id="spdT" data-i18n="speed">VELOCITÀ</h2>
      </div>
      <output id="spdOut" for="spd">1×</output>
    </div>
    <!-- Speed preset buttons: "0,25×", "1×", "1,25×", "1,5×", "2×" -->
    <div class="chips speed-grid" id="spdChips">
      <button type="button" data-v="25">0,25×</button>
      <button type="button" data-v="100">1×</button>
      <button type="button" data-v="125">1,25×</button>
      <button type="button" data-v="150">1,5×</button>
      <button type="button" data-v="200">2×</button>
    </div>
    <div class="slider-wrapper">
      <input type="range" id="spd" min="25" max="500" step="5" value="100" aria-labelledby="spdT">
    </div>
    <div class="ticks spd-ticks" aria-hidden="true">
      <span style="--f:0">0,25×</span>
      <span style="--f:.1579">1×</span>
      <span style="--f:.3684">2×</span>
      <span style="--f:.5789">3×</span>
      <span style="--f:.7895">4×</span>
      <span style="--f:1">5×</span>
    </div>
    <p id="spdNote" class="note" role="status" hidden></p>
  </section>
</main>

<script src="compat.js"></script>
<script src="popup.js"></script>
</body>
</html>
