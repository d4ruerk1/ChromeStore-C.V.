<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<header id="header">
  <img src="icons/icon32.png" alt="" width="24" height="24" class="logo">
  <h1 id="headerTitle">C.V.</h1>
  <div class="header-actions">
    <button id="reset" class="icon-btn ghost" type="button" title="" data-i18n-title="reset" aria-label="Reset">
      <!-- reset icon -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
      </svg>
    </button>
    <button id="settingsBtn" class="icon-btn ghost" type="button" data-i18n-title="settings" aria-label="Settings">
      <!-- gear icon -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button id="coffeeBtn" class="icon-btn coffee-btn ghost" type="button" title="Support on Ko-fi" aria-label="Support on Ko-fi">
      <!-- coffee cup icon -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
        <line x1="6" y1="1" x2="6" y2="4"/>
        <line x1="10" y1="1" x2="10" y2="4"/>
        <line x1="14" y1="1" x2="14" y2="4"/>
      </svg>
    </button>
  </div>
</header>

<!-- Settings panel (full-view when active) -->
<div id="settingsPanel" class="panel settings-view" hidden>
  <div class="panel-header">
    <button id="settingsBackBtn" class="icon-btn ghost back-btn" type="button" aria-label="Back" title="Back">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <h2 data-i18n="settingsTitle">Settings</h2>
  </div>

  <div class="settings-content">
    <label class="setting-row">
      <div class="setting-text">
        <span class="setting-title" data-i18n="settingRemember">Remember volume per tab</span>
        <span class="setting-desc" data-i18n="settingRememberDesc">Keeps volume level across tab navigation</span>
      </div>
      <input type="checkbox" id="rememberVol" checked>
    </label>

    <label class="setting-row">
      <div class="setting-text">
        <span class="setting-title" data-i18n="settingUpdate">Update notifications</span>
        <span class="setting-desc">
          <a href="https://github.com/d4ruerk1/ChromeStore-C.V" target="_blank" rel="noopener noreferrer" class="link">github.com/d4ruerk1/ChromeStore-C.V</a>
        </span>
      </div>
      <input type="checkbox" id="notifyUpdates" checked>
    </label>

    <div id="updateBanner" class="update-banner" hidden>
      <div class="update-info">
        <span class="update-tag">NEW</span>
        <span id="updateVersionText">Update available!</span>
      </div>
      <a id="updateLink" href="https://github.com/d4ruerk1/ChromeStore-C.V" target="_blank" rel="noopener noreferrer" class="update-btn">View on GitHub</a>
    </div>

    <!-- Donate button in settings -->
    <div class="settings-action">
      <button id="settingsDonateBtn" class="donate-btn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
          <line x1="6" y1="1" x2="6" y2="4"/>
          <line x1="10" y1="1" x2="10" y2="4"/>
          <line x1="14" y1="1" x2="14" y2="4"/>
        </svg>
        <span data-i18n="donateText">Support the developer on Ko-fi</span>
      </button>
    </div>

    <!-- Author & compliance info -->
    <div class="settings-footer">
      <div class="author-row">
        <span>Created by </span><a href="https://github.com/d4ruerk1" target="_blank" rel="noopener noreferrer" class="link author-link">d4ruerk1</a>
        <span class="ver-pill">v1.1.0</span>
      </div>
      <p class="legal-desc" data-i18n="legalNotice">Compliant with EU GDPR and Italian Privacy Laws. Zero data collection, 100% local audio processing.</p>
    </div>
  </div>
</div>

<p id="restricted" class="note restricted-note" role="status" hidden data-i18n="restricted"></p>

<main id="main">
  <section aria-labelledby="volT">
    <div class="row">
      <h2 id="volT" data-i18n="volume"></h2>
      <output id="volOut" for="vol">100%</output>
    </div>
    <input type="range" id="vol" min="0" max="500" step="1" value="100" aria-labelledby="volT">
    <div class="ticks" aria-hidden="true">
      <span style="--f:0">0</span>
      <span style="--f:.2">100%</span>
      <span style="--f:.4">200%</span>
      <span style="--f:.6">300%</span>
      <span style="--f:.8">400%</span>
      <span style="--f:1">500%</span>
    </div>
    <div class="chips" id="volChips">
      <button type="button" data-v="0" data-i18n="mute"></button>
      <button type="button" data-v="50">50%</button>
      <button type="button" data-v="100">100%</button>
      <button type="button" data-v="200">200%</button>
      <button type="button" data-v="300">300%</button>
      <button type="button" data-v="500">500%</button>
    </div>
    
    <!-- Dismissable concise warning -->
    <div id="volNoteBox" class="note-box warn" role="status" hidden>
      <span id="volNoteText" class="note-box-text" data-i18n="boostWarning">Volume > 100%: audio may distort.</span>
      <button id="dismissVolNote" class="note-close-btn" type="button" aria-label="Dismiss warning" title="Do not show again">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <p id="volErrorNote" class="note warn" role="status" hidden></p>
  </section>

  <section aria-labelledby="spdT">
    <div class="row">
      <h2 id="spdT" data-i18n="speed"></h2>
      <output id="spdOut" for="spd">1×</output>
    </div>
    <div class="chips" id="spdChips">
      <button type="button" data-v="25">0.25×</button>
      <button type="button" data-v="50">0.5×</button>
      <button type="button" data-v="100">1×</button>
      <button type="button" data-v="125">1.25×</button>
      <button type="button" data-v="150">1.5×</button>
      <button type="button" data-v="200">2×</button>
      <button type="button" data-v="300">3×</button>
      <button type="button" data-v="500">5×</button>
    </div>
    <input type="range" id="spd" min="25" max="500" step="5" value="100" aria-labelledby="spdT">
    <div class="ticks" aria-hidden="true">
      <span style="--f:0">0.25×</span>
      <span style="--f:.1579">1×</span>
      <span style="--f:.3684">2×</span>
      <span style="--f:.5789">3×</span>
      <span style="--f:.7895">4×</span>
      <span style="--f:1">5×</span>
    </div>
    <p id="spdNote" class="note" role="status" hidden></p>
  </section>
</main>

<script src="compat.js"></script>
<script src="popup.js"></script>
</body>
</html>
